<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旅途帳本｜旅行記帳小幫手</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f5;color:#193c35;font:16px system-ui,'Microsoft JhengHei',sans-serif}main{max-width:1050px;margin:auto;padding:38px 20px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:34px;margin:8px 0}h2{font-size:20px;margin:0 0 20px}.eyebrow{letter-spacing:3px;font-size:12px;font-weight:bold;color:#37836d}.muted,footer{color:#63766e;font-size:14px;line-height:1.8}.hero{background:#173f35;color:white;padding:28px;border-radius:24px;margin:28px 0}.hero .muted{color:#c8dbd1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px}.stat{padding:18px;background:#ffffff12;border-radius:16px}.stat span{display:block;font-size:13px;color:#c8dbd1}.stat strong{font-size:28px;display:block;margin-top:8px;overflow-wrap:anywhere}progress{width:100%;height:12px;margin-top:24px;accent-color:#e5bb6f}.grid{display:grid;grid-template-columns:340px 1fr;gap:22px}.card{background:white;border:1px solid #e1e8e3;border-radius:20px;padding:24px}.card+.card{margin-top:18px}label{display:block;margin:14px 0 6px;font-size:14px;font-weight:600}input,select,button{font:inherit}input,select{width:100%;padding:12px;border:1px solid #cddbd2;border-radius:10px;background:#fff;color:#193c35}button{cursor:pointer;border:0;border-radius:10px;padding:12px 18px;background:#24664f;color:#fff;font-weight:600}button:hover{filter:brightness(.93)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #d5ab55;outline-offset:3px}.wide{width:100%;margin-top:16px}.light{background:#edf3ee;color:#28513f}.danger{background:#fff0ec;color:#a34231;font-size:13px;padding:8px 12px}.listhead{display:flex;align-items:center;justify-content:space-between;gap:10px}.listhead h2{margin:0}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0;border-bottom:1px solid #edf1ed}.item b{overflow-wrap:anywhere}.item small{display:block;color:#748178;margin-top:5px}.item .right{display:flex;align-items:center;gap:12px;flex-shrink:0}.empty{text-align:center;padding:55px 12px;color:#748178}.notice{margin-top:12px;font-size:14px;line-height:1.7}.over{color:#ffd39c}#message{min-height:24px;color:#9c3e2c;font-size:14px;margin-top:12px}footer{margin-top:26px;text-align:center}@media(max-width:760px){.grid{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:21px}h1{font-size:28px}.hero{padding:20px}.item .right{gap:8px}.card{padding:20px}header{align-items:flex-start}header>span{display:none}}@media(max-width:380px){.stats{grid-template-columns:1fr}.item{flex-wrap:wrap}}
</style></head><body><main><header><div><div class="eyebrow">TRAVEL BUDGET</div><h1>旅途帳本</h1><div class="muted">把花費記清楚，讓旅行更自在。</div></div><span aria-hidden="true" style="font-size:45px">🧳</span></header>
<section class="hero" aria-label="預算總覽"><div class="muted">每一筆記錄，都是旅行的足跡 · TWD 新臺幣</div><div class="stats"><div class="stat"><span>旅行預算</span><strong id="total">$0</strong></div><div class="stat"><span>已花金額</span><strong id="spent">$0</strong></div><div class="stat"><span>剩餘預算</span><strong id="remaining">$0</strong></div></div><progress id="progress" max="100" value="0" aria-label="預算使用比例"></progress><div id="status" class="notice" aria-live="polite"></div></section>
<div class="grid"><div><section class="card"><h2>設定旅行預算</h2><form id="budgetForm"><label for="budget">總預算（元）</label><input id="budget" type="number" min="0.01" max="999999999" step="0.01" placeholder="例如：20000" required><button class="wide" type="submit">儲存預算</button></form></section><section class="card"><h2>新增一筆支出</h2><form id="expenseForm"><label for="name">支出名稱</label><input id="name" maxlength="60" placeholder="例如：機場到飯店車資" required><label for="category">分類</label><select id="category"><option>餐飲</option><option>交通</option><option>住宿</option><option>購物</option><option>娛樂</option><option>其他</option></select><label for="amount">金額（元）</label><input id="amount" type="number" min="0.01" max="999999999" step="0.01" placeholder="例如：200" required><button class="wide" type="submit">＋ 新增支出</button></form><div id="message" role="status" aria-live="polite"></div></section></div>
<section class="card"><div class="listhead"><h2>支出紀錄 <small id="count" class="muted">0 筆</small></h2><button id="clear" class="light" type="button">清空紀錄</button></div><div id="list"></div><div id="summary" class="muted" style="margin-top:20px"></div></section></div><footer>資料僅儲存在目前瀏覽器，換裝置不會同步；清除瀏覽器資料可能使紀錄消失。<br>旅行記帳小幫手 · 單檔互動網頁</footer></main>
<script>
'use strict';
const KEY='travel-budget-v1';const $=id=>document.getElementById(id);let state={budget:0,items:[]};let storageWarning='';
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Number.isSafeInteger(saved.budget)&&saved.budget>=0&&Array.isArray(saved.items)){state.budget=saved.budget;state.items=saved.items.filter(x=>x&&typeof x.id==='string'&&typeof x.name==='string'&&typeof x.category==='string'&&Number.isSafeInteger(x.cents)&&x.cents>0)}}catch(e){storageWarning='無法讀取瀏覽器儲存資料，目前仍可記帳。'}
const money=c=>new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:2}).format(c/100);
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){storageWarning='瀏覽器儲存失敗，重新整理後可能遺失本次變更。';return false}}
function cents(value){const n=Number(value);return Number.isFinite(n)&&n>0&&n<=999999999?Math.round(n*100):null}
function render(){const spent=state.items.reduce((a,x)=>a+x.cents,0);$('total').textContent=money(state.budget);$('spent').textContent=money(spent);$('remaining').textContent=money(state.budget-spent);$('remaining').classList.toggle('over',spent>state.budget);$('progress').value=state.budget?Math.min(100,spent/state.budget*100):0;$('status').textContent=!state.budget?'先設定預算，再開始規劃你的旅行。':spent>state.budget?'已超出預算 '+money(spent-state.budget)+'，留意接下來的花費。':'已使用 '+(spent/state.budget*100).toFixed(1)+'% 的預算。';$('count').textContent=state.items.length+' 筆';$('list').replaceChildren();if(!state.items.length){const e=document.createElement('div');e.className='empty';e.textContent='還沒有支出紀錄，新增你的第一筆花費吧！';$('list').append(e)}for(const x of [...state.items].reverse()){const row=document.createElement('div');row.className='item';const left=document.createElement('div');const title=document.createElement('b');title.textContent=x.name;const cat=document.createElement('small');cat.textContent=x.category;left.append(title,cat);const right=document.createElement('div');right.className='right';const price=document.createElement('b');price.textContent=money(x.cents);const del=document.createElement('button');del.type='button';del.className='danger';del.textContent='刪除';del.setAttribute('aria-label','刪除 '+x.name);del.onclick=()=>{state.items=state.items.filter(i=>i.id!==x.id);save();render();$('message').textContent=storageWarning||'已刪除這筆支出。'};right.append(price,del);row.append(left,right);$('list').append(row)}const totals={};for(const x of state.items)totals[x.category]=(totals[x.category]||0)+x.cents;$('summary').textContent=Object.entries(totals).map(([k,v])=>k+' '+money(v)).join(' · ');$('clear').disabled=!state.items.length}
$('budgetForm').onsubmit=e=>{e.preventDefault();const v=cents($('budget').value);if(!v){$('message').textContent='請輸入大於 0 的有效預算。';return}state.budget=v;save();render();$('message').textContent=storageWarning||'預算已儲存。'};
$('expenseForm').onsubmit=e=>{e.preventDefault();const name=$('name').value.trim();const v=cents($('amount').value);if(!name||!v){$('message').textContent='請填寫名稱及大於 0 的有效金額。';return}state.items.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),name,category:$('category').value,cents:v});save();render();$('expenseForm').reset();$('name').focus();$('message').textContent=storageWarning||'已新增支出。'};
$('clear').onclick=()=>{if(state.items.length&&confirm('確定清空所有支出紀錄？旅行預算將保留。')){state.items=[];save();render();$('message').textContent=storageWarning||'支出紀錄已清空。'}};
if(state.budget)$('budget').value=state.budget/100;render();$('message').textContent=storageWarning;
</script></body></html>
